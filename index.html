<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗記マスター</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        
        <div id="menu-screen">
            <h1>🎓 暗記マスター</h1>
            <p>学習したい科目を選んでください</p>
            <div class="menu-buttons">
                <button id="btn-select-kobun" class="btn btn-red btn-large">古文助動詞</button>
                <button id="btn-select-science" class="btn btn-green btn-large">理科 元素記号</button>
                <button id="btn-select-english" class="btn btn-blue btn-large">英語 不規則動詞</button>
            </div>
        </div>

        <div id="game-screen" style="display: none;">
            <div class="header-area">
                <button id="btn-back-menu" class="btn btn-gray">＜ メニューへ</button>
                <h1 id="subject-title">タイトル</h1>
            </div>
            
            <div class="control-panel">
                <div id="mode-view-controls">
                    <button id="btn-hide-all" class="btn btn-red">全隠し</button>
                    <button id="btn-random" class="btn btn-orange">ランダム</button>
                    <button id="btn-show-all" class="btn btn-blue">全表示</button>
                    <button id="btn-start-test" class="btn btn-green">入力テスト</button>
                </div>

                <div id="mode-test-controls" style="display: none;">
                    <button id="btn-check" class="btn btn-blue">答え合わせ</button>
                    <button id="btn-retry" class="btn btn-orange">やり直し</button>
                    <button id="btn-end-test" class="btn btn-red">終了</button>
                </div>
            </div>

            <p class="instruction" id="instruction-text">マスをタップして答え合わせができます</p>

            <div class="table-wrapper">
                <table id="app-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
