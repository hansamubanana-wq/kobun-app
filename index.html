<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助動詞一覧 暗記ツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>❖ 助動詞一覧 ❖</h1>
        <p>クリックして隠す・表示する機能を後で追加します。</p>
        
        <div class="table-wrapper">
            <table id="verb-table">
                <thead>
                    <tr>
                        <th rowspan="2" class="header-basic">基本形</th>
                        <th rowspan="2" class="header-connect">接続</th>
                        <th colspan="6" class="header-conj">活用形</th>
                        <th rowspan="2" class="header-type">活用の型</th>
                        <th rowspan="2" class="header-mean">おもな意味</th>
                    </tr>
                    <tr class="subheader">
                        <th>未然形</th>
                        <th>連用形</th>
                        <th>終止形</th>
                        <th>連体形</th>
                        <th>已然形</th>
                        <th>命令形</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
